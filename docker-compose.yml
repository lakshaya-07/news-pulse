services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: newspulse
      POSTGRES_PASSWORD: newspulse
      POSTGRES_DB: newspulse
    ports:
      - "5432:5432"
    volumes:
      - newspulse_pg:/var/lib/postgresql/data
      - ./database/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newspulse -d newspulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  newspulse_pg:
