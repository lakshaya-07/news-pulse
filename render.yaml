services:
  - type: web
    name: news-pulse-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SIMILARITY_THRESHOLD
        value: "0.28"
      - key: PYTHON_BIN
        value: python3
      - key: NODE_ENV
        value: production
